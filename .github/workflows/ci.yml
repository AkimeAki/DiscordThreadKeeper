name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # .env.development.localはCIに無いので、マイグレーションの確認に使うDBをここで渡す。テストはテストごとに別のDBを作る
      DATABASE_URL: file:./ci.db
    steps:
      - name: コードを取得
        uses: actions/checkout@v7

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: 依存関係とKyselyの型を準備
        run: |
          npm ci
          npm run db:generate

      - name: 型とLintを確認
        run: npm run lint

      - name: 整形を確認
        run: npx prettier --check .

      - name: マイグレーションが反映できるか確認
        run: npx prisma migrate deploy

      - name: テストを実行
        run: npm test
